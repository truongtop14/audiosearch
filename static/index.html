<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DThU Search – Tra cứu thông tin</title><style>
:root{--blue:#2563eb;--ink:#202124;--muted:#64748b;--border:#e5e7eb}*{box-sizing:border-box}body{margin:0;font-family:Arial,Roboto,sans-serif;color:var(--ink);background:#fff}header{display:flex;justify-content:flex-end;gap:24px;padding:23px 40px;font-size:14px}header a{color:#4b5563;text-decoration:none}.hero{min-height:58vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}.brand{font-size:clamp(42px,8vw,78px);font-weight:700;letter-spacing:-3px;color:var(--blue)}.brand span{color:#f59e0b}.subtitle{font-size:16px;color:#64748b;margin:3px 0 30px}.searchbox{display:flex;align-items:center;width:min(680px,94vw);border:1px solid #dadce0;border-radius:30px;padding:7px 10px 7px 20px;box-shadow:0 2px 7px #00000012;gap:8px;background:white}.searchbox:focus-within{box-shadow:0 3px 12px #00000020}.searchbox input{flex:1;border:0;outline:0;font-size:17px;min-width:0;padding:9px 0}.iconbtn{border:0;background:transparent;cursor:pointer;font-size:20px;padding:8px;border-radius:50%}.iconbtn:hover{background:#f1f5f9}.submit{background:var(--blue);border:0;color:white;border-radius:24px;padding:11px 21px;cursor:pointer;font-weight:600}.submit:hover{background:#1d4ed8}.hint{font-size:13px;color:var(--muted);margin-top:20px}.message{margin:14px 0;color:#64748b;font-size:14px;min-height:18px}.message.error{color:#dc2626}.results{display:none;max-width:850px;margin:20px auto;padding:0 24px 80px}.result-top{display:flex;align-items:center;gap:22px;border-bottom:1px solid var(--border);padding:18px 0 23px}.result-top .brand{font-size:27px;letter-spacing:-1px;white-space:nowrap}.result-top .searchbox{width:100%}.result-top .submit{padding:9px 14px}.results .meta{font-size:13px;color:var(--muted);margin:20px 0}.result{margin:30px 0}.result .url{font-size:13px;color:#475569;word-break:break-all;margin-bottom:7px}.result a{font-size:20px;color:#1a0dab;text-decoration:none;line-height:1.4}.result a:hover{text-decoration:underline}.result .desc{font-size:14px;color:#5f6368;margin-top:7px;line-height:1.6}.pill{font-size:12px;color:#64748b;background:#f1f5f9;border-radius:10px;padding:4px 8px;margin-left:8px}.sort{font-size:13px;color:#475569}.sort select{border:1px solid var(--border);border-radius:8px;padding:6px;background:white}.results-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.recording{color:#dc2626!important;animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.35}}.loader{display:inline-block;width:14px;height:14px;border:2px solid #ddd;border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:650px){header{padding:18px}.hero{min-height:65vh}.result-top{display:block}.result-top .brand{display:block;margin-bottom:14px}.results{padding:0 16px}.searchbox{padding-left:12px}.submit{padding:10px 12px}.result a{font-size:18px}}
.brand{display:flex;align-items:center;justify-content:center;gap:12px;letter-spacing:-2px}.brand-logo{width:74px;height:74px;object-fit:contain;flex-shrink:0}.result-top .brand-logo{width:38px;height:38px}.result-top .brand{justify-content:flex-start;gap:9px}@media(max-width:650px){.brand-logo{width:58px;height:58px}.result-top .brand-logo{width:34px;height:34px}}
</style></head><body>
<header><a href="/docs" target="_blank" rel="noopener">API Docs</a><a href="/api/health" target="_blank" rel="noopener">Trạng thái</a></header>
<section class="hero" id="hero"><div class="brand"><img class="brand-logo" src="/static/dthu-logo.png" alt="Logo Trường Đại học Đồng Tháp">DThU <span>Search</span></div><div class="subtitle">Tìm kiếm thông báo và thông tin Trường Đại học Đồng Tháp</div><form class="searchbox" id="homeForm"><span aria-hidden="true">⌕</span><input id="homeQuery" aria-label="Từ khóa tìm kiếm" placeholder="Tìm thông báo, học phí, tuyển sinh..." autocomplete="off" required><button class="iconbtn mic" type="button" title="Tìm bằng giọng nói" aria-label="Tìm bằng giọng nói">🎙️</button><button class="submit">Tìm kiếm</button></form><div class="message" id="homeMsg" role="status"></div><div class="hint">Ví dụ: học phí năm 2025 · tuyển sinh thạc sĩ · chứng chỉ VSTEP</div></section>
<section class="results" id="results"><div class="result-top"><a href="/" style="text-decoration:none"><div class="brand"><img class="brand-logo" src="/static/dthu-logo.png" alt="Logo Trường Đại học Đồng Tháp">DThU <span>Search</span></div></a><form class="searchbox" id="resultForm"><input id="resultQuery" aria-label="Từ khóa tìm kiếm" placeholder="Nhập từ khóa..." required><button class="iconbtn mic" type="button" title="Tìm bằng giọng nói" aria-label="Tìm bằng giọng nói">🎙️</button><button class="submit">Tìm</button></form></div><div class="message" id="resultMsg" role="status"></div><div class="results-head"><div class="meta" id="meta"></div><label class="sort">Sắp xếp <select id="sort"><option value="id">Mới nhất (ID)</option><option value="score">Liên quan (BM25)</option></select></label></div><div id="items"></div></section>
<script>
const hero=document.getElementById('hero'),results=document.getElementById('results');let last=[];const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function showResults(){hero.style.display='none';results.style.display='block';window.scrollTo(0,0)}
function msg(s,error=false){let el=document.getElementById(results.style.display==='block'?'resultMsg':'homeMsg');el.textContent=s;el.className='message'+(error?' error':'')}
function draw(){let arr=[...last];if(document.getElementById('sort').value==='score')arr.sort((a,b)=>b.score-a.score);else arr.sort((a,b)=>b.id-a.id);const root=document.getElementById('items');root.replaceChildren();if(!arr.length){root.textContent='Không tìm thấy kết quả phù hợp. Hãy thử từ khóa khác.';return}for(const item of arr){const wrap=document.createElement('article');wrap.className='result';const url=document.createElement('div');url.className='url';url.textContent=item.url;const a=document.createElement('a');a.textContent=item.title;a.href=item.url;a.target='_blank';a.rel='noopener noreferrer';const desc=document.createElement('div');desc.className='desc';desc.textContent='Mã văn bản: '+item.id+' · Điểm BM25: '+Number(item.score).toFixed(3);wrap.append(url,a,desc);root.append(wrap)}}
async function execute(request,query){showResults();document.getElementById('resultQuery').value=query||'';msg('Đang tìm kiếm...');document.getElementById('items').replaceChildren();try{const response=await request;const data=await response.json();if(!response.ok)throw new Error(typeof data.detail==='string'?data.detail:'Không thể thực hiện tìm kiếm');last=data.results||[];document.getElementById('resultQuery').value=data.normalized_query||data.query||query||'';document.getElementById('meta').textContent=`${data.total} kết quả · Từ khóa: ${data.normalized_query}`;msg(data.transcription?'🎙️ Đã nhận dạng: '+data.transcription:'');draw();history.replaceState(null,'','/?q='+encodeURIComponent(data.normalized_query||query||''))}catch(e){msg('Lỗi: '+e.message,true);document.getElementById('meta').textContent=''}}
function textSearch(q){q=q.trim();if(!q)return;execute(fetch('/api/search/text',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q,top_k:20})}),q)}
document.getElementById('homeForm').addEventListener('submit',e=>{e.preventDefault();textSearch(document.getElementById('homeQuery').value)});document.getElementById('resultForm').addEventListener('submit',e=>{e.preventDefault();textSearch(document.getElementById('resultQuery').value)});document.getElementById('sort').addEventListener('change',draw);
let recorder=null,stream=null,chunks=[];async function toggleMic(){if(recorder&&recorder.state==='recording'){recorder.stop();return}if(!navigator.mediaDevices?.getUserMedia){msg('Micro chỉ hoạt động trên HTTPS hoặc localhost.',true);return}try{stream=await navigator.mediaDevices.getUserMedia({audio:true});const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(x=>MediaRecorder.isTypeSupported(x));recorder=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{document.querySelectorAll('.mic').forEach(b=>{b.classList.remove('recording');b.textContent='🎙️'});stream.getTracks().forEach(t=>t.stop());const type=recorder.mimeType||'audio/webm',ext=type.includes('mp4')?'m4a':'webm',blob=new Blob(chunks,{type});const form=new FormData();form.append('file',blob,'recording.'+ext);execute(fetch('/api/search/audio?top_k=20',{method:'POST',body:form}),'');};recorder.start();document.querySelectorAll('.mic').forEach(b=>{b.classList.add('recording');b.textContent='⏹️'});msg('Đang ghi âm... Nhấn nút dừng để tìm kiếm.')}catch(e){msg('Không thể sử dụng micro: '+e.message,true)}}document.querySelectorAll('.mic').forEach(b=>b.addEventListener('click',toggleMic));const initial=new URLSearchParams(location.search).get('q');if(initial){document.getElementById('homeQuery').value=initial;textSearch(initial)}
</script></body></html>
